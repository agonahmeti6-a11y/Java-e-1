<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materialet</title>
</head>
<body>
    <h1>Materialet</h1>
    <p>Shembull ilustrimi</p>
    <img src="ilustrim.png" alt="Ilustrim i materialeve" width="300">

    <h2>Lista</h2>
    <ul>
        <li>Fletore</li>
        <li>Libra</li>
        <li>Letra</li>
    </ul>

    <p>Shumat në euro</p>
    <table>
        <caption>Shumat në euro</caption>
        <thead>
            <tr>
                <th scope="col">Kategoria</th>
                <th scope="col">Shuma</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fletore</td>
                <td>—</td>
            </tr>
            <tr>
                <td>Libra</td>
                <td>—</td>
            </tr>
            <tr>
                <td>Letra</td>
                <td>—</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Totali</th>
                <td>—</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
